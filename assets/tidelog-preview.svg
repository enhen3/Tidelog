<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog feature preview</title>
  <desc id="desc">A polished feature preview showing review prompts, dashboard, calendar heatmap, and insights in TideLog colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF8F9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5AABB8"/>
      <stop offset="1" stop-color="#3B8EA5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F1DEAA"/>
      <stop offset="1" stop-color="#D4B978"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#123844" flood-opacity="0.11"/>
    </filter>
    <style>
      .h { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 56px; font-weight: 800; fill: #061113; letter-spacing: -1.8px; }
      .p { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 520; fill: #557078; }
      .k { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 31px; font-weight: 760; fill: #061113; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 19px; font-weight: 680; fill: #6E858C; }
      .chip { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 720; fill: #3B8EA5; }
    </style>
  </defs>
  <rect width="1600" height="960" rx="48" fill="url(#bg)"/>
  <circle cx="1420" cy="92" r="260" fill="#D4B978" opacity="0.16"/>
  <text x="96" y="112" class="h">功能不堆叠，只服务一个闭环</text>
  <text x="96" y="160" class="p">从当天计划，到晚间复盘，再到长期洞察，每一步都回到下一次行动。</text>
  <g transform="translate(96 226)" filter="url(#shadow)">
    <rect width="650" height="286" rx="38" fill="#FFFFFF" stroke="#D8E8EC"/>
    <rect x="34" y="34" width="96" height="42" rx="21" fill="#E8F4F6"/>
    <text x="54" y="63" class="chip">Review</text>
    <text x="34" y="124" class="k">复盘问题可以按你的方法调整</text>
    <text x="34" y="170" class="p">问题名称、内容、顺序、启用状态都可配置。</text>
    <rect x="34" y="214" width="582" height="34" rx="17" fill="#E9F3F5"/>
    <rect x="34" y="214" width="424" height="34" rx="17" fill="url(#teal)"/>
  </g>
  <g transform="translate(854 226)" filter="url(#shadow)">
    <rect width="650" height="286" rx="38" fill="#FFFFFF" stroke="#E8DDB9"/>
    <rect x="34" y="34" width="104" height="42" rx="21" fill="#FFF6DF"/>
    <text x="54" y="63" class="chip" fill="#A8842F">Insight</text>
    <text x="34" y="124" class="k">周报/月报自动提炼模式</text>
    <text x="34" y="170" class="p">把情绪趋势、成功模式和挑战变成报告。</text>
    <circle cx="72" cy="230" r="18" fill="#3B8EA5"/>
    <circle cx="126" cy="230" r="18" fill="#5AABB8"/>
    <circle cx="180" cy="230" r="18" fill="#D4B978"/>
    <circle cx="234" cy="230" r="18" fill="#C47070"/>
  </g>
  <g transform="translate(96 580)" filter="url(#shadow)">
    <rect width="650" height="286" rx="38" fill="#FFFFFF" stroke="#D8E8EC"/>
    <rect x="34" y="34" width="116" height="42" rx="21" fill="#E8F4F6"/>
    <text x="54" y="63" class="chip">Calendar</text>
    <text x="34" y="124" class="k">日历热力图看见情绪波动</text>
    <text x="34" y="170" class="p">快速定位高低波动日，和当天复盘一起回看。</text>
    <g transform="translate(34 214)">
      <rect width="36" height="36" rx="10" fill="#CFE5E9"/><rect x="48" width="36" height="36" rx="10" fill="#A9D0D7"/><rect x="96" width="36" height="36" rx="10" fill="#5AABB8"/><rect x="144" width="36" height="36" rx="10" fill="#3B8EA5"/><rect x="192" width="36" height="36" rx="10" fill="#E8DDB9"/><rect x="240" width="36" height="36" rx="10" fill="#D4B978"/>
    </g>
  </g>
  <g transform="translate(854 580)" filter="url(#shadow)">
    <rect width="650" height="286" rx="38" fill="#061113"/>
    <rect x="34" y="34" width="132" height="42" rx="21" fill="#143943"/>
    <text x="54" y="63" class="chip" fill="#A9D0D7">Dashboard</text>
    <text x="34" y="124" class="k" fill="#FFFFFF">今日聚焦、原则和长期画像</text>
    <text x="34" y="170" class="p" fill="#CFE5E9">任务、精力、情绪与模式聚合到一个视图。</text>
    <rect x="34" y="218" width="250" height="24" rx="12" fill="#3B8EA5"/>
    <rect x="304" y="218" width="170" height="24" rx="12" fill="#D4B978"/>
    <rect x="494" y="218" width="88" height="24" rx="12" fill="#C47070"/>
  </g>
</svg>
