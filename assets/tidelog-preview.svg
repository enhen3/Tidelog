<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog feature overview</title>
  <desc id="desc">A premium TideLog feature overview using the product colors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse"><stop stop-color="#060506"/><stop offset=".56" stop-color="#0B1417"/><stop offset="1" stop-color="#10252C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B8EA5"/><stop offset=".58" stop-color="#5AABB8"/><stop offset="1" stop-color="#D4B978"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".34"/></filter>
    <style>.eyebrow{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;fill:#D4B978}.title{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:54px;font-weight:680;letter-spacing:-1.8px;fill:#F5F3EA}.h{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:25px;font-weight:700;fill:#F5F3EA}.b{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:18px;font-weight:460;fill:#B9C6C8}.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;fill:#D4B978}</style>
  </defs>
  <rect width="1600" height="980" rx="40" fill="url(#bg)"/>
  <circle cx="1220" cy="140" r="360" fill="#D4B978" fill-opacity=".10"/><circle cx="280" cy="880" r="420" fill="#3B8EA5" fill-opacity=".16"/>
  <text x="96" y="102" class="eyebrow">TIDELOG CORE EXPERIENCE</text><text x="96" y="172" class="title">One vault. Three connected surfaces.</text>
  <g transform="translate(92 248)">
    <g filter="url(#shadow)"><rect width="688" height="560" rx="34" fill="#FFFFFF" fill-opacity=".052" stroke="#FFFFFF" stroke-opacity=".10"/><rect x="30" y="30" width="628" height="64" rx="20" fill="#FFFFFF" fill-opacity=".055"/><circle cx="66" cy="62" r="9" fill="#C47070"/><circle cx="94" cy="62" r="9" fill="#D4B978"/><circle cx="122" cy="62" r="9" fill="#3B8EA5"/><text x="162" y="68" class="b">Obsidian / Daily Note</text><rect x="44" y="132" width="600" height="92" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><text x="72" y="169" class="h">Plan</text><text x="72" y="200" class="b">Day · week · month · idea inbox</text><rect x="44" y="252" width="286" height="120" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><text x="72" y="292" class="h">Review</text><text x="72" y="326" class="b">Close the loop.</text><rect x="358" y="252" width="286" height="120" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><text x="386" y="292" class="h">Insights</text><text x="386" y="326" class="b">Preview reports.</text><rect x="44" y="404" width="600" height="104" rx="24" fill="url(#accent)"/><text x="72" y="444" class="h" fill="#061113">Updated plan</text><text x="72" y="478" class="b" fill="#061113">Let new records update the next plan.</text></g>
  </g>
  <g transform="translate(860 248)">
    <g transform="translate(0 0)" filter="url(#shadow)"><rect width="292" height="246" rx="30" fill="#FFFFFF" fill-opacity=".052" stroke="#FFFFFF" stroke-opacity=".10"/><text x="30" y="54" class="mono">01</text><text x="30" y="96" class="h">Plan</text><text x="30" y="132" class="b">Put day, week, month tasks and ideas in one planning surface.</text></g>
    <g transform="translate(324 0)" filter="url(#shadow)"><rect width="292" height="246" rx="30" fill="#FFFFFF" fill-opacity=".052" stroke="#FFFFFF" stroke-opacity=".10"/><text x="30" y="54" class="mono">02</text><text x="30" y="96" class="h">Review</text><text x="30" y="132" class="b">Complete today’s loop or catch up on a past date.</text></g>
    <g transform="translate(0 282)" filter="url(#shadow)"><rect width="292" height="246" rx="30" fill="#FFFFFF" fill-opacity=".052" stroke="#FFFFFF" stroke-opacity=".10"/><text x="30" y="54" class="mono">03</text><text x="30" y="96" class="h">Insights</text><text x="30" y="132" class="b">Preview weekly reports, monthly reports, and AI view of you.</text></g>
    <g transform="translate(324 282)" filter="url(#shadow)"><rect width="292" height="246" rx="30" fill="#FFFFFF" fill-opacity=".052" stroke="#FFFFFF" stroke-opacity=".10"/><text x="30" y="54" class="mono">04</text><text x="30" y="96" class="h">Update</text><text x="30" y="132" class="b">When new records arrive, refresh reports and planning suggestions.</text></g>
  </g>
</svg>
