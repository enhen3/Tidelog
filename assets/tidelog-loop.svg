<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog workflow loop</title>
  <desc id="desc">A visual loop from morning plan to daily log, evening review, insight, and better action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF7FF"/>
      <stop offset="1" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <style>
      .h { font: 800 50px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #151426; }
      .t { font: 750 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #171827; }
      .p { font: 500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5F5878; }
      .step { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
    </style>
  </defs>
  <rect width="1600" height="640" rx="48" fill="url(#bg)"/>
  <text x="100" y="104" class="h">一条可以每天重复的成长闭环</text>
  <text x="100" y="152" class="p">TideLog 把“写下来”推进到“看见模式，再调整行动”。</text>
  <path d="M266 355C380 205 618 205 730 355C842 505 1080 505 1194 355" stroke="#D8CCFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M1200 355C1276 255 1398 255 1458 323" stroke="#D8CCFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M1458 323L1426 318M1458 323L1450 292" stroke="#D8CCFF" stroke-width="22" stroke-linecap="round"/>
  <g transform="translate(100 250)">
    <rect width="270" height="182" rx="34" fill="white" stroke="#E6E0F4"/>
    <circle cx="52" cy="52" r="28" fill="url(#accent)"/><text x="44" y="61" class="step">1</text>
    <text x="34" y="112" class="t">晨间计划</text>
    <text x="34" y="150" class="p">精力、优先级、任务</text>
  </g>
  <g transform="translate(410 250)">
    <rect width="270" height="182" rx="34" fill="white" stroke="#E6E0F4"/>
    <circle cx="52" cy="52" r="28" fill="url(#accent)"/><text x="44" y="61" class="step">2</text>
    <text x="34" y="112" class="t">当日记录</text>
    <text x="34" y="150" class="p">任务、情绪、事件</text>
  </g>
  <g transform="translate(720 250)">
    <rect width="270" height="182" rx="34" fill="white" stroke="#E6E0F4"/>
    <circle cx="52" cy="52" r="28" fill="url(#accent)"/><text x="44" y="61" class="step">3</text>
    <text x="34" y="112" class="t">晚间复盘</text>
    <text x="34" y="150" class="p">目标、成果、焦虑</text>
  </g>
  <g transform="translate(1030 250)">
    <rect width="270" height="182" rx="34" fill="white" stroke="#E6E0F4"/>
    <circle cx="52" cy="52" r="28" fill="url(#accent)"/><text x="44" y="61" class="step">4</text>
    <text x="34" y="112" class="t">AI 洞察</text>
    <text x="34" y="150" class="p">周报、月报、模式</text>
  </g>
  <g transform="translate(1340 250)">
    <rect width="160" height="182" rx="34" fill="#171827"/>
    <circle cx="52" cy="52" r="28" fill="#34D399"/><text x="44" y="61" class="step">5</text>
    <text x="34" y="112" class="t" fill="#FFFFFF">行动</text>
    <text x="34" y="150" class="p" fill="#C4BEDA">下一步</text>
  </g>
</svg>
