<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog feedback loop</title>
  <desc id="desc">The TideLog loop: Plan, Review, Insights, Action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060506"/><stop offset="0.58" stop-color="#0B1417"/><stop offset="1" stop-color="#10252C"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="320" x2="1280" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B8EA5"/><stop offset="0.58" stop-color="#5AABB8"/><stop offset="1" stop-color="#D4B978"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/></filter>
    <style>
      .title{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:44px;font-weight:680;letter-spacing:-1.4px;fill:#F5F3EA}
      .label{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:24px;font-weight:700;fill:#F5F3EA}
      .body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:17px;font-weight:460;fill:#B9C6C8}
      .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14px;font-weight:600;fill:#D4B978;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1400" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="310" fill="#D4B978" fill-opacity=".10"/>
  <circle cx="210" cy="460" r="330" fill="#3B8EA5" fill-opacity=".15"/>
  <text x="80" y="92" class="mono">TIDELOG LOOP</text>
  <text x="80" y="148" class="title">From daily notes to decisions</text>
  <path d="M190 314C350 178 516 176 682 296C842 412 1014 390 1216 206" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M190 314C350 178 516 176 682 296C842 412 1014 390 1216 206" stroke="#F5F3EA" stroke-opacity=".36" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(94 250)" filter="url(#shadow)"><rect width="210" height="126" rx="24" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="28" y="52" class="label">Plan</text><text x="28" y="86" class="body">clarify the day</text></g>
  <g transform="translate(420 166)" filter="url(#shadow)"><rect width="210" height="126" rx="24" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="28" y="52" class="label">Review</text><text x="28" y="86" class="body">compare with reality</text></g>
  <g transform="translate(746 282)" filter="url(#shadow)"><rect width="210" height="126" rx="24" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="28" y="52" class="label">Insights</text><text x="28" y="86" class="body">see the pattern</text></g>
  <g transform="translate(1072 144)" filter="url(#shadow)"><rect width="210" height="126" rx="24" fill="url(#accent)"/><text x="28" y="52" class="label" fill="#061113">Action</text><text x="28" y="86" class="body" fill="#061113">change tomorrow</text></g>
</svg>
