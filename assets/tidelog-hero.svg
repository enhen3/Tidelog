<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog product hero</title>
  <desc id="desc">A premium product hero presenting TideLog as a feedback loop for Obsidian daily notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A10"/>
      <stop offset="0.58" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 180) rotate(136) scale(600 360)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 740) rotate(-24) scale(520 280)">
      <stop stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BE7F1"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="38" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .label{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:22px;font-weight:650;letter-spacing:5px;fill:#93C5FD;opacity:.9}
      .title{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:74px;font-weight:680;line-height:1;letter-spacing:-3px;fill:#F8FAFC}
      .sub{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:30px;font-weight:430;fill:#CBD5E1;letter-spacing:-.4px}
      .small{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:19px;font-weight:560;fill:#B6C4D6}
      .cardTitle{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:24px;font-weight:680;fill:#F8FAFC}
      .body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:20px;font-weight:460;fill:#B9C6D6}
      .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:17px;font-weight:520;fill:#93C5FD}
    </style>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="44" fill="url(#glowA)"/>
  <rect width="1600" height="900" rx="44" fill="url(#glowB)"/>
  <g opacity=".18">
    <path d="M0 705C230 620 392 632 604 702C850 783 1038 760 1218 654C1378 560 1500 552 1600 588" stroke="url(#accent)" stroke-width="2"/>
    <path d="M0 760C240 686 410 696 608 752C854 820 1040 802 1244 704C1394 632 1502 626 1600 652" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="1"/>
  </g>
  <g transform="translate(112 142)">
    <text x="0" y="0" class="label">TIDELOG FOR OBSIDIAN</text>
    <text x="0" y="96" class="title">Daily notes</text>
    <text x="0" y="182" class="title">need a feedback loop.</text>
    <text x="0" y="258" class="sub">Plan the day. Review the evening.</text>
    <text x="0" y="302" class="sub">Find patterns. Decide what to do next.</text>
    <g transform="translate(0 382)">
      <rect width="560" height="78" rx="24" fill="white" fill-opacity=".055" stroke="white" stroke-opacity=".10"/>
      <text x="28" y="48" class="mono">Plan → Review → Insight → Action</text>
    </g>
    <g transform="translate(0 500)">
      <rect width="180" height="48" rx="24" fill="#F8FAFC"/>
      <text x="33" y="31" class="small" fill="#0B1020">Markdown-first</text>
      <rect x="198" width="154" height="48" rx="24" fill="white" fill-opacity=".055" stroke="white" stroke-opacity=".10"/>
      <text x="233" y="31" class="small">No telemetry</text>
      <rect x="370" width="166" height="48" rx="24" fill="white" fill-opacity=".055" stroke="white" stroke-opacity=".10"/>
      <text x="404" y="31" class="small">AI optional</text>
    </g>
  </g>
  <g transform="translate(852 116)" filter="url(#shadow)">
    <rect width="600" height="660" rx="34" fill="#0F172A" stroke="white" stroke-opacity=".12"/>
    <rect x="24" y="24" width="552" height="72" rx="22" fill="white" fill-opacity=".05"/>
    <circle cx="62" cy="60" r="10" fill="#EF4444" opacity=".72"/><circle cx="92" cy="60" r="10" fill="#F59E0B" opacity=".72"/><circle cx="122" cy="60" r="10" fill="#22C55E" opacity=".72"/>
    <text x="166" y="66" class="small">TideLog / Today</text>
    <g transform="translate(44 132)">
      <rect width="512" height="112" rx="26" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".075"/>
      <text x="28" y="42" class="cardTitle">Morning plan</text>
      <text x="28" y="78" class="body">Energy, priorities, tasks, carry-forward items</text>
      <path d="M408 58C434 28 468 30 492 58" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(44 276)">
      <rect width="244" height="148" rx="26" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".075"/>
      <text x="26" y="42" class="cardTitle">Evening review</text>
      <text x="26" y="80" class="body">Goals · emotions</text>
      <text x="26" y="112" class="body">lessons · tomorrow</text>
    </g>
    <g transform="translate(312 276)">
      <rect width="244" height="148" rx="26" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".075"/>
      <text x="26" y="42" class="cardTitle">AI insight</text>
      <text x="26" y="80" class="body">Patterns, principles,</text>
      <text x="26" y="112" class="body">next actions</text>
    </g>
    <g transform="translate(44 456)">
      <rect width="512" height="152" rx="26" fill="url(#accent)" opacity=".94"/>
      <text x="30" y="48" class="cardTitle" fill="#06111F">This week’s pattern</text>
      <text x="30" y="88" class="body" fill="#07111E">You make better progress when the first task</text>
      <text x="30" y="120" class="body" fill="#07111E">is concrete before opening chat or feeds.</text>
    </g>
  </g>
</svg>
