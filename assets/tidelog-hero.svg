<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog hero</title>
  <desc id="desc">A refined Apple-inspired product hero for TideLog, using tidal blue and warm gold.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFC"/>
      <stop offset="0.55" stop-color="#EEF7F8"/>
      <stop offset="1" stop-color="#F8F3E6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5AABB8"/>
      <stop offset="1" stop-color="#3B8EA5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F1DEAA"/>
      <stop offset="1" stop-color="#D4B978"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#123844" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#123844" flood-opacity="0.16"/>
    </filter>
    <style>
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 5px; fill: #3B8EA5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 78px; font-weight: 800; fill: #061113; letter-spacing: -3px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 540; fill: #344B51; }
      .cardTitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 760; fill: #061113; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 520; fill: #557078; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 680; fill: #6E858C; }
      .metric { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 48px; font-weight: 820; fill: #061113; letter-spacing: -1px; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="1340" cy="110" r="320" fill="#3B8EA5" opacity="0.10"/>
  <circle cx="116" cy="790" r="360" fill="#D4B978" opacity="0.14"/>
  <path d="M1060 134C1192 70 1342 84 1458 166" stroke="#FFFFFF" stroke-width="2" opacity="0.72"/>
  <g transform="translate(124 126)">
    <text x="0" y="0" class="eyebrow">TIDELOG</text>
    <text x="0" y="94" class="title">把复盘变成</text>
    <text x="0" y="184" class="title">真正会改变行动的系统</text>
    <text x="0" y="260" class="subtitle">每天两次轻量引导，把计划、记录、复盘和洞察</text>
    <text x="0" y="306" class="subtitle">沉淀成可以长期回看的个人模式库。</text>
    <g transform="translate(0 384)">
      <rect width="166" height="54" rx="27" fill="#061113"/>
      <text x="38" y="36" class="small white">晨间计划</text>
      <rect x="184" width="166" height="54" rx="27" fill="#FFFFFF" stroke="#D8E8EC"/>
      <text x="222" y="36" class="small">晚间复盘</text>
      <rect x="368" width="166" height="54" rx="27" fill="#FFFFFF" stroke="#D8E8EC"/>
      <text x="410" y="36" class="small">AI 洞察</text>
    </g>
  </g>
  <g transform="translate(886 128)" filter="url(#cardShadow)">
    <rect width="574" height="646" rx="44" fill="#FFFFFF" stroke="#D7E8EB"/>
    <rect x="28" y="28" width="518" height="92" rx="28" fill="#F3FAFB"/>
    <circle cx="78" cy="74" r="24" fill="url(#teal)"/>
    <text x="124" y="68" class="small">Today</text>
    <text x="124" y="98" class="body">Plan → Review → Insight</text>
    <g transform="translate(44 162)">
      <text x="0" y="0" class="small">Energy</text>
      <text x="0" y="64" class="metric">8.2</text>
      <rect x="128" y="22" width="348" height="20" rx="10" fill="#E7F2F4"/>
      <rect x="128" y="22" width="276" height="20" rx="10" fill="url(#teal)"/>
    </g>
    <g transform="translate(44 286)">
      <rect width="228" height="164" rx="30" fill="#F7FBFC" stroke="#DBEBEE"/>
      <text x="28" y="46" class="cardTitle">Plan</text>
      <text x="28" y="86" class="body">优先级 · 任务</text>
      <path d="M30 122H176" stroke="#3B8EA5" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(302 286)">
      <rect width="228" height="164" rx="30" fill="#FFF9EA" stroke="#EFE1B8"/>
      <text x="28" y="46" class="cardTitle">Review</text>
      <text x="28" y="86" class="body">目标 · 情绪 · 明天</text>
      <path d="M30 122H184" stroke="#D4B978" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(44 486)">
      <rect width="486" height="112" rx="30" fill="#061113"/>
      <text x="30" y="48" class="cardTitle white">Insight</text>
      <text x="30" y="82" class="body" fill="#D8E8EC">周报 · 月报 · 模式 · 原则</text>
      <circle cx="414" cy="56" r="28" fill="url(#gold)"/>
    </g>
  </g>
  <g transform="translate(126 658)" filter="url(#softShadow)">
    <rect width="206" height="100" rx="28" fill="#FFFFFF" stroke="#D7E8EB"/>
    <text x="28" y="44" class="small">Markdown-first</text>
    <text x="28" y="73" class="body">写回你的 Vault</text>
  </g>
  <g transform="translate(358 658)" filter="url(#softShadow)">
    <rect width="206" height="100" rx="28" fill="#FFFFFF" stroke="#D7E8EB"/>
    <text x="28" y="44" class="small">Private by design</text>
    <text x="28" y="73" class="body">你控制数据流向</text>
  </g>
</svg>
