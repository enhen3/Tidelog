<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog logo</title>
  <desc id="desc">A minimal dark app icon showing a tide curve crossing structured daily note lines.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="tide" x1="98" y1="330" x2="420" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE7F1"/>
      <stop offset="0.45" stop-color="#5FA8FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="22" y="18" width="468" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="66" y="132" width="380" height="270" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.72 0 0 0 0 1 0 0 0 0.34 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="54" y="42" width="404" height="428" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="96" y="90" width="320" height="332" rx="48" fill="white" fill-opacity="0.035" stroke="white" stroke-opacity="0.085" stroke-width="2"/>
  <path d="M145 156H278" stroke="white" stroke-opacity="0.86" stroke-width="20" stroke-linecap="round"/>
  <path d="M145 212H346" stroke="white" stroke-opacity="0.52" stroke-width="18" stroke-linecap="round"/>
  <path d="M145 268H310" stroke="white" stroke-opacity="0.34" stroke-width="18" stroke-linecap="round"/>
  <path d="M145 324H246" stroke="white" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <path d="M106 336C162 276 209 279 256 309C308 342 359 323 407 250" stroke="url(#tide)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M106 336C162 276 209 279 256 309C308 342 359 323 407 250" stroke="white" stroke-opacity="0.46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="407" cy="250" r="20" fill="#F8FAFC"/>
  <circle cx="407" cy="250" r="10" fill="#7C3AED"/>
</svg>
