<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog logo</title>
  <desc id="desc">A premium TideLog app icon: a tide curve turns daily note lines into an action point.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="438" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10252C"/>
      <stop offset="0.48" stop-color="#071417"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(348 128) rotate(136) scale(310 260)">
      <stop stop-color="#D4B978" stop-opacity="0.30"/>
      <stop offset="0.48" stop-color="#3B8EA5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3B8EA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tide" x1="96" y1="328" x2="416" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B8EA5"/>
      <stop offset="0.58" stop-color="#5AABB8"/>
      <stop offset="1" stop-color="#D4B978"/>
    </linearGradient>
    <filter id="shadow" x="16" y="16" width="480" height="492" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="60" y="136" width="392" height="264" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.56 0 0 0 0 0.65 0 0 0 0.34 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="52" y="40" width="408" height="432" rx="108" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="52" y="40" width="408" height="432" rx="108" fill="url(#halo)"/>
  <rect x="94" y="88" width="324" height="334" rx="52" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M144 154H278" stroke="#F5F3EA" stroke-opacity="0.88" stroke-width="20" stroke-linecap="round"/>
  <path d="M144 210H344" stroke="#F5F3EA" stroke-opacity="0.50" stroke-width="18" stroke-linecap="round"/>
  <path d="M144 266H308" stroke="#F5F3EA" stroke-opacity="0.30" stroke-width="18" stroke-linecap="round"/>
  <path d="M144 322H232" stroke="#F5F3EA" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <path d="M104 336C160 276 207 278 256 308C309 341 362 319 408 246" stroke="url(#tide)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 336C160 276 207 278 256 308C309 341 362 319 408 246" stroke="#F8F5EA" stroke-opacity="0.42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="408" cy="246" r="22" fill="#F5F3EA"/>
  <circle cx="408" cy="246" r="10" fill="#D4B978"/>
</svg>
