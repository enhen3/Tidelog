<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TideLog Pro Afdian cover</title>
  <desc id="desc">A premium cover image for TideLog Pro purchase page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#060506"/><stop offset=".56" stop-color="#0B1417"/><stop offset="1" stop-color="#10252C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B8EA5"/><stop offset=".58" stop-color="#5AABB8"/><stop offset="1" stop-color="#D4B978"/></linearGradient>
    <radialGradient id="gold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 170) rotate(136) scale(560 360)"><stop stop-color="#D4B978" stop-opacity=".24"/><stop offset="1" stop-color="#D4B978" stop-opacity="0"/></radialGradient>
    <radialGradient id="teal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 760) rotate(-22) scale(560 320)"><stop stop-color="#3B8EA5" stop-opacity=".30"/><stop offset="1" stop-color="#3B8EA5" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="34" stdDeviation="40" flood-color="#000" flood-opacity=".42"/></filter>
    <style>.eyebrow{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:24px;font-weight:750;letter-spacing:6px;fill:#D4B978}.title{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:86px;font-weight:680;letter-spacing:-3.5px;fill:#F5F3EA}.sub{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:32px;font-weight:460;fill:#C9D2D2}.pill{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:22px;font-weight:650;fill:#F5F3EA}.price{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;font-size:52px;font-weight:720;fill:#061113}.small{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:22px;font-weight:560;fill:#B9C6C8}</style>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/><rect width="1600" height="900" rx="44" fill="url(#gold)"/><rect width="1600" height="900" rx="44" fill="url(#teal)"/>
  <g transform="translate(110 142)">
    <text x="0" y="0" class="eyebrow">TIDELOG PRO</text>
    <text x="0" y="112" class="title">把 Daily Note</text>
    <text x="0" y="210" class="title">变成反馈系统</text>
    <text x="0" y="294" class="sub">Plan 计划 · Review 复盘 · Insights 洞察</text>
    <g transform="translate(0 378)"><rect width="608" height="74" rx="24" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="30" y="47" class="pill">Plan → Review → Insights</text></g>
    <g transform="translate(0 514)"><rect width="284" height="96" rx="28" fill="url(#accent)"/><text x="34" y="62" class="price">¥39/年</text><rect x="310" width="332" height="96" rx="28" fill="#F5F3EA"/><text x="344" y="62" class="price">¥78 终身版</text></g>
  </g>
  <g transform="translate(900 136)" filter="url(#shadow)">
    <rect width="560" height="628" rx="42" fill="#0B1417" stroke="#FFFFFF" stroke-opacity=".12"/>
    <rect x="40" y="42" width="480" height="104" rx="28" fill="#FFFFFF" fill-opacity=".055"/><text x="76" y="106" class="pill">TideLog / Pro</text>
    <g transform="translate(46 194)"><rect width="468" height="88" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><circle cx="46" cy="44" r="12" fill="#3B8EA5"/><text x="78" y="53" class="small">完整 Review 问题流</text></g>
    <g transform="translate(46 310)"><rect width="468" height="88" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><circle cx="46" cy="44" r="12" fill="#D4B978"/><text x="78" y="53" class="small">周报 / 月报洞察</text></g>
    <g transform="translate(46 426)"><rect width="468" height="88" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".075"/><circle cx="46" cy="44" r="12" fill="#F5F3EA"/><text x="78" y="53" class="small">报告预览 / AI 眼中的你</text></g>
  </g>
</svg>
