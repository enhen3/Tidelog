name = "tidelog-license-api"
main = "src/index.ts"
compatibility_date = "2026-08-28"
workers_dev = false

# Custom domain route (China-accessible)
routes = [
  { pattern = "tidelog-api.mydreamchronicle.com/*", zone_name = "mydreamchronicle.com" }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "tidelog-license-db"
database_id = "7930769b-81dd-44ae-a133-ba4150f37742"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

# Environment variables (set via wrangler secret)
# ADMIN_TOKEN — protects /admin/* endpoints
# DEEPSEEK_API_KEY — set with: npx wrangler secret put DEEPSEEK_API_KEY
# Do not add the secret value to [vars] or commit it to this file.
