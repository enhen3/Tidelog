name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build and publish
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          # 24 而不是 20：api/test-p0-concurrency.mjs 用 node:sqlite 跑真实 SQLite
          # 来验证 P0 的原子 INSERT，该模块在 v23.4 之前需要 --experimental-sqlite。
          # Node 20 上 npm run check 会直接失败，发版流程也会一起挂掉。
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify manifest version
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const expected = process.env.RELEASE_TAG;
          if (manifest.version !== expected) {
            throw new Error(`manifest.json version ${manifest.version} does not match release tag ${expected}`);
          }
          NODE

      - run: npm run check

      - name: Create or update GitHub release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -f "RELEASE_NOTES_${RELEASE_TAG}.md" ]; then
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
            else
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
